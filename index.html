<head>

  <title>For Shafa ❤️</title>
</head>
<body>
  <h1>To My Dearest Shafa ❤️</h1>

  <button onclick="showMessage()">Open My Letter 💌</button>

      document.getElementById("message").innerHTML =
      "I'm sorry for everything. Thank you for every beautiful memory we've shared. No matter what happens, you'll always have a special place in my heart. ❤️";
    }
  </script>
</body>
</html>
